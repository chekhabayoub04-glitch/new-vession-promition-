<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>new vession promotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .prop-navbar {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6%; height: 68px;
      background: rgba(10,10,10,0.97); backdrop-filter: blur(22px);
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--light); font-size: 13px; font-weight: 600;
      text-decoration: none; padding: 8px 18px;
      border: 1px solid var(--border); border-radius: 6px; transition: var(--t);
    }
    .back-btn:hover { color: var(--gold); border-color: var(--gold); }
    .detail-wrap { max-width: 1300px; margin: 0 auto; padding: 46px 6% 90px; }
    @media (max-width: 900px) {
      .detail-wrap > div > div:last-child { grid-template-columns: 1fr !important; }
      .detail-wrap > div > div:first-child { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="prop-navbar">
  <a href="index.html" class="logo">
    <div class="logo-icon"><i class="on the top jpgs"></i></div>
    <div class="logo-text">
      <span class="logo-main">عنابة إيمو</span>
      <span class="logo-sub">ANNABA IMMO</span>
    </div>
  </a>
  <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
</nav>

<!-- MAIN CONTENT -->
<div class="detail-wrap">
  <div id="detailRoot">
    <div style="text-align:center;padding:90px 0;color:var(--muted)">
      <i class="fas fa-spinner fa-spin" style="font-size:38px;color:var(--gold)"></i>
      <p style="margin-top:14px;font-size:15px">جاري تحميل تفاصيل العقار...</p>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <div class="lb-wrap">
    <button class="lb-x" id="lbX"><i class="fas fa-times"></i></button>
    <button class="lb-p" id="lbP"><i class="fas fa-chevron-right"></i></button>
    <img class="lb-img" id="lbImg" src="" alt="">
    <button class="lb-n" id="lbN"><i class="fas fa-chevron-left"></i></button>
    <div class="lb-ctr" id="lbCtr"></div>
  </div>
</div>

<script src="js/property.js"></script>
</body>
</html>
